backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

shadow = true;

animations = ();

rules = (
  {
    match = "class_i = 'mpv-wallpaper'";
    animations = ();
    shadow = false;
  },
  {
    match = "override_redirect = true && class_i != 'rofi' && class_i != 'notif_center'";
    animations = ();
    shadow = false;
  },
  {
    match = "class_i = 'rofi'";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.95; duration = 0.15; }
    );
  },
  {
    match = "(class_i = 'notif_center' || class_g = 'notif_center')";
    animations = (
      { triggers = ["open", "show"]; preset = "slide-in"; direction = "right"; duration = 0.10; },
      { triggers = ["close", "hide"]; preset = "slide-out"; direction = "right"; duration = 0.08; }
    );
    shadow = true;
  },
  {
    match = "class_i = 'polybar'";
    shadow = false;
  },
  {
    match = "class_i != 'mpv-wallpaper' && override_redirect = false";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.95; duration = 0.15; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.95; duration = 0.12; }
    );
  }
);
