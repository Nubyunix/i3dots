# ~/.config/notif_center/config.ini
# Archivo de configuracion para notif_center (Centro de Notificaciones) y notif_daemon

[geometry]
# Ancho del panel en pixeles
width = 400

# Margen lateral derecho respecto a la pantalla
margin_right = 12

# Margen de separacion general (espacio entre el panel y la barra o bordes de pantalla)
margin_gap = 12

# Ajuste automatico segun la posicion de Polybar (top / bottom)
# Si es true (por defecto), calcula dinamicamente la altura y posicion para no solapar la barra.
auto_adjust_bar = true

# Margenes manuales fijos (solo se usan si auto_adjust_bar = false)
margin_top = 42
margin_bottom = 14

[appearance]
# Radios de bordes (0 para bordes perfectamente cuadrados acordes al dotfile)
panel_radius = 0
card_radius = 0
button_radius = 0
border_width = 1

# Posicion del icono en la tarjeta ('left' o 'right')
icon_position = left

# Previsualizacion de imagenes y capturas de notificaciones
show_images = true
image_size = 48

# Tipografia
font_title = JetBrainsMono Nerd Font Bold 12
font_bold = JetBrainsMono Nerd Font Bold 10
font_normal = JetBrainsMono Nerd Font 9
font_small = JetBrainsMono Nerd Font 8

[toast]
# Ancho de las notificaciones emergentes (popups) en pixeles
width = 380

# Separacion entre notificaciones y margenes de pantalla
gap = 10

# Radio de bordes de las tarjetas emergentes (0 para bordes rectos/cuadrados acordes al dotfile)
radius = 0

# Ancho del borde en pixeles
border_width = 1

[osd]
# Habilitar OSD emergente moderno para controles de sistema (Volumen, Brillo, Microfono)
enabled = true

# Orientacion del indicador: 'vertical' o 'horizontal'
orientation = vertical

# Posicion en pantalla:
# Para 'vertical': 'right' o 'left'
# Para 'horizontal': 'center', 'right' o 'top_right'
position = right

# Dimensiones en pixeles (50x210 para vertical, 240x50 para horizontal)
width = 50
height = 210

# Margen respecto al borde de la pantalla
margin = 24

# Radio de bordes del OSD (0 para bordes rectos)
radius = 0

# Ancho del borde del OSD
border_width = 1

[history]
# Cantidad maxima de notificaciones guardadas en el historial (default: 500, max: 1024)
max_entries = 500

[colors]
# Descomentar para forzar colores estaticos.
# Por defecto se heredan automaticamente de Matugen (~/.config/polybar/colors.ini).
# bg_panel = #181d18
# bg_card = #262b26
# bg_card_hover = #353a35
# border = #414941
# accent = #97d5a5
# accent_dim = #384b3c
# fg_text = #dfe4dc
# fg_muted = #8b938a
